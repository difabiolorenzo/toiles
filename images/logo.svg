<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Toiles — « L'étoile tissée » : trois fils qui se croisent (l'étoile, le tissage
       des liens), un cœur évidé et un point d'accent.
       Fichier utilisé comme icône d'onglet (favicon). Les couleurs suivent le thème
       du système grâce à la règle @media ci-dessous (Carte céleste / Nuit vivante).
       Le fond n'est pas transparent au centre : le petit disque « vide » prend la
       couleur de l'onglet, d'où un trait plus épais qu'en grand pour rester lisible à 16 px. -->
  <style>
    .fil { stroke: #241b10; }
    .point { fill: #6e4f17; }
    @media (prefers-color-scheme: dark) {
      .fil { stroke: #f4f5ff; }
      .point { fill: #b8c0ff; }
    }
  </style>
  <g class="fil" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="58"/>
    <line x1="9.5" y1="19" x2="54.5" y2="45"/>
    <line x1="9.5" y1="45" x2="54.5" y2="19"/>
  </g>
  <circle class="point" cx="32" cy="32" r="6"/>
</svg>
